<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Maithri 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-red-500">Registration Records</h1>
            <button onclick="window.print()" class="bg-white text-black px-4 py-2 rounded font-bold hover:bg-gray-200">Print List</button>
        </div>

        <div class="overflow-x-auto bg-gray-800 rounded-lg shadow-xl">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-red-700 text-white uppercase text-sm">
                        <th class="p-4">Name</th>
                        <th class="p-4">PIN / ID</th>
                        <th class="p-4">Mobile</th>
                        <th class="p-4">Branch</th>
                        <th class="p-4">Category</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-700">
                    {% for student in students %}
                    <tr class="hover:bg-gray-700 transition">
                        <td class="p-4 font-medium">{{ student[0] }}</td>
                        <td class="p-4 text-gray-300">{{ student[1] }}</td>
                        <td class="p-4 text-gray-300">{{ student[2] }}</td>
                        <td class="p-4 font-bold text-blue-400">{{ student[3] }}</td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded text-xs font-bold 
                                {{ 'bg-yellow-500 text-black' if student[4] == 'vip' else 'bg-green-600' }}">
                                {{ student[4].upper() }}
                            </span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
