<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Maithri 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        select option { background: #1e293b; color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    
    <div class="text-center mb-8">
        <h1 class="text-4xl font-extrabold tracking-tighter text-blue-400">WELCOME TO MAITHRI 2026</h1>
        <p class="text-gray-400 mt-2 font-medium uppercase tracking-widest">Experience the Magic | May 8th - 9th, 2026</p>
    </div>

    <div class="glass-card p-8 rounded-2xl w-full max-w-md shadow-2xl">
        
        {% if success %}
        <div class="bg-blue-600/20 border border-blue-500 rounded-xl p-5 mb-6 text-center animate-bounce">
            <h3 class="text-lg font-bold text-blue-200">Registration Complete!</h3>
            <p class="text-sm text-gray-300 mb-4 italic">Welcome aboard, {{ name }}</p>
            <a href="/download_ticket/{{ name }}/{{ pin }}/{{ category }}" 
               class="bg-blue-500 hover:bg-blue-400 text-white font-bold py-2 px-8 rounded-full shadow-lg transition-all inline-block">
                DOWNLOAD MY PASS
            </a>
        </div>
        {% endif %}

        <form action="/register" method="POST" class="space-y-5">
            <div>
                <label class="text-xs font-bold text-gray-500 uppercase ml-1">Full Name</label>
                <input type="text" name="name" required class="w-full bg-slate-800/50 border border-slate-700 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Enter Name">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase ml-1">PIN / ID</label>
                    <input type="text" name="pin" required class="w-full bg-slate-800/50 border border-slate-700 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Roll No">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase ml-1">Phone</label>
                    <input type="text" name="mobile" required class="w-full bg-slate-800/50 border border-slate-700 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Mobile">
                </div>
            </div>

            <div>
                <label class="text-xs font-bold text-gray-500 uppercase ml-1 text-blue-300">Select Branch</label>
                <select name="branch" required class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg outline-none cursor-pointer hover:border-blue-500">
                    <option value="" disabled selected>-- Choose Branch --</option>
                    <option value="CSE">Computer Science</option>
                    <option value="ECE">Electronics</option>
                    <option value="MECH">Mechanical</option>
                    <option value="CIVIL">Civil</option>
                    <option value="EEE">Electrical</option>
                </select>
            </div>

            <div>
                <label class="text-xs font-bold text-gray-500 uppercase ml-1">Category</label>
                <select name="category" required class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg outline-none cursor-pointer">
                    <option value="student">Student</option>
                    <option value="vip">VIP Guest</option>
                    <option value="volunteer">Volunteer</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 py-4 rounded-xl font-bold text-lg shadow-xl active:scale-95 transition-all">
                GENERATE MY ENTRY PASS
            </button>
        </form>
    </div>
</body>
</html>
