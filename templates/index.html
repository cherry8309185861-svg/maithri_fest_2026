<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maithri 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        select option { background: #1e293b; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
    
    <div class="mb-8">
        <h1 class="text-4xl font-black text-blue-500 tracking-tighter">WELCOME TO MAITHRI 2026</h1>
        <p class="text-gray-400 mt-2 font-bold uppercase tracking-widest text-sm">March 6th & 7th, 2026</p>
    </div>

    <div class="glass-card p-8 rounded-3xl w-full max-w-md shadow-2xl text-left">
        {% if success %}
        <div class="bg-blue-600/20 border border-blue-500 rounded-xl p-5 mb-6 text-center">
            <h3 class="text-lg font-bold text-blue-200">Registration Success!</h3>
            <p class="text-sm text-gray-300 mb-4 italic">See you on March 6th, {{ name }}!</p>
            <a href="/download_ticket/{{ name }}/{{ pin }}/{{ category }}" 
               class="bg-blue-500 hover:bg-blue-400 text-white font-bold py-2 px-8 rounded-full shadow-lg transition-all inline-block">
                DOWNLOAD MY PASS
            </a>
        </div>
        {% endif %}

        <form action="/register" method="POST" class="space-y-4">
            <div>
                <label class="text-xs font-bold text-gray-500 uppercase ml-1">Full Name</label>
                <input type="text" name="name" required class="w-full bg-slate-800/50 border border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Your Name">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label
