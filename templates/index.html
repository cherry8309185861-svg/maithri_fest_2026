<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maithri 2026 Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(to bottom right, #4c1d95, #b91c1c, #f59e0b); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .main-card { 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(15px); 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        input, select {
            background: rgba(255, 255, 255, 0.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: white !important;
            border-radius: 10px !important;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.7); }
        option { background: #b91c1c; color: white; }
    </style>
</head>
<body>
    <div class="main-card text-center text-white">
        <h1 class="text-3xl font-bold mb-1">Maithri Fest 2026</h1>
        <p class="text-sm opacity-80 mb-6 uppercase tracking-widest">March 6th & 7th, 2026</p>

        {% if success %}
        <div class="bg-white text-red-700 p-4 rounded-xl mb-6 shadow-lg">
            <p class="font-bold">Welcome, {{ name }}!</p>
            <p class="text-xs mb-3">Your ID: {{ pin }}</p>
            <a href="/download_ticket/{{ name }}/{{ pin }}/{{ category }}" 
               class="inline-block bg-red-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-red-700 transition">
               Download Entry Pass
            </a>
        </div>
        {% endif %}

        <form action="/register" method="POST" class="space-y-4">
            <input type="text" name="name" required placeholder="STUDENT FULL NAME" class="w-full p-3 outline-none">
            
            <div class="flex gap-2">
                <input type="text" name="pin" required placeholder="PIN / ROLL NO" class="w-1/2 p-3 outline-none">
                <input type="text" name="mobile" required placeholder="MOBILE NO" class="w-1/2 p-3 outline-none">
            </div>

            <select name="branch" required class="w-full p-3 outline-none cursor-pointer">
                <option value="" disabled selected>SELECT YOUR BRANCH</option>
                <option value="CSE">Computer Science</option>
                <option value="ECE">Electronics</option>
                <option value="MECH">Mechanical</option>
                <option value="CIVIL">Civil</option>
                <option value="EEE">Electrical</option>
            </select>

            <select name="category" required class="w-full p-3 outline-none cursor-pointer">
                <option value="student">NORMAL STUDENT</option>
                <option value="vip">VIP GUEST / CIP</option>
                <option value="volunteer">VOLUNTEER</option>
            </select>

            <button type="submit" class="w-full bg-white text-red-700 font-bold py-4 rounded-xl shadow-lg hover:bg-gray-100 transition-all active:scale-95 text-lg uppercase">
                Register & Generate Pass
            </button>
        </form>

        <p class="mt-6 text-[10px] opacity-60 uppercase">Developed for Maithri 2026 | Admission subject to ID verification</p>
    </div>
</body>
</html>
